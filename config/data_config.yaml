data_collection:
  # Директории по умолчанию
  default_source_dir: "../dvm-crystal-data/data"
  results_directory: "./data/raw"
  problems_directory: "./problems"
  
  # Путь к SAPFOR
  sapfor_executable: "Sapfor_F"
  
  # Поддерживаемые расширения файлов
  file_extensions: [".f", ".f90", ".fdv"]
  
  # Флаги компиляции для профилирования
  compiler_flags: "-O3 -g -fprofile-arcs -ftest-coverage"
  
  # Шаблоны временных файлов для очистки
  temp_file_patterns:
    - "*.gcda"
    - "*.gcno"
    - "*.gcov"
    - "*.dep"
    - "*.proj"
    - "*.mod"
  
  # Файлы для сохранения в результатах
  preserved_files:
    - "info.json"
    - "*_output.log"
    - "*.gcov"
  
  # Настройки логирования для сбора данных
  logging:
    level: "INFO"
    format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

data_aggregation:
  cover_directory: './data/raw'
  results_directory: '../dvm-crystal-data/results'
  output_directory: './data/processed'